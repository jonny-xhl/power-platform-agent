<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Tag</title>
    <link rel="stylesheet" href="../shared/css/XRM.Common.css">
    <link rel="stylesheet" href="../css/contact_tags.css">
</head>
<body>
    <div class="contact-tag-root">
        <div class="contact-tag-header">
            <span class="contact-tag-title">Contact Tag</span>
            <button class="contact-tag-add-btn" id="addTagBtn" type="button">+ Add Tag</button>
        </div>
        <div class="contact-tag-selectall">
            <input type="checkbox" id="selectAllTags">
            <label for="selectAllTags">Select all</label>
        </div>
        <div class="contact-tag-list" id="tagList">
            <div class="contact-tag-loading">Loading tags...</div>
        </div>
        <div class="contact-tag-footer">
            <span id="tagPagination">0 of 0</span>
            <span class="contact-tag-pager"><span class="pg-prev">&#8249;</span> <span id="tagPage">1 / 1</span> <span class="pg-next">&#8250;</span></span>
        </div>
    </div>
    <script src="../ClientGlobalContext.js.aspx"></script>
    <script src="../shared/js/XRM.Common.js"></script>
    <script src="../js/contact_tags.js"></script>
</body>
</html>
