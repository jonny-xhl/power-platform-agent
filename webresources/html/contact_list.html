<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact List</title>
    <link rel="stylesheet" href="../shared/css/XRM.Common.css">
    <link rel="stylesheet" href="../css/contact_list.css">
</head>
<body>
    <div class="contact-list-root">
        <!-- Header -->
        <div class="contact-list-header">
            <div class="contact-list-title">Contact List</div>
            <div class="contact-list-meta">
                <span class="contact-list-refresh">Last Refresh: <span id="lastRefresh">—</span></span>
                <button class="contact-list-summary-btn" id="seeSummaryBtn" type="button">See full summary &#9662;</button>
            </div>
        </div>

        <!-- Toolbar -->
        <div class="contact-list-toolbar">
            <input type="text" id="searchInput" class="contact-list-search" placeholder="Search contacts..." autocomplete="off">
            <button class="contact-list-new-btn" id="newContactBtn" type="button">+ New Contact</button>
        </div>

        <!-- Table -->
        <div class="contact-list-table-wrap">
            <table class="contact-list-table">
                <thead>
                    <tr>
                        <th class="col-name">Name</th>
                        <th class="col-email">Email</th>
                        <th class="col-pic">HKL PIC</th>
                        <th class="col-title">Title</th>
                        <th class="col-meeting">Latest Meeting</th>
                        <th class="col-feedback">Feedback</th>
                    </tr>
                </thead>
                <tbody id="contactTbody">
                    <tr class="contact-list-loading-row"><td colspan="6">Loading contacts...</td></tr>
                </tbody>
            </table>
            <div class="contact-list-empty" id="emptyState" style="display:none;">No contacts found for this tenant.</div>
        </div>

        <!-- Footer / pagination -->
        <div class="contact-list-footer">
            <span id="paginationInfo">Showing 0 to 0 of 0</span>
        </div>
    </div>

    <!-- Dataverse context + shared library + page script -->
    <script src="../ClientGlobalContext.js.aspx"></script>
    <script src="../shared/js/XRM.Common.js"></script>
    <script src="../js/contact_list.js"></script>
</body>
</html>
